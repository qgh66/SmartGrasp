[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "molmo-annotator"
version = "0.1.0"
description = "Molmo-based image annotator: generates numbered label image + pixel-coordinate points JSON."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Your Team" }]

dependencies = [
  "numpy>=1.21",
  "pillow>=9.0",
  "matplotlib>=3.6",
  "torch",
  "transformers>=4.40"
]

[project.scripts]
molmo-annotate = "molmo_annotator.cli:main"

[tool.setuptools]
packages = ["molmo_annotator"]